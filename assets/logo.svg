<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Neon Deck logo: a cut-corner "deck card" with a neon edge and the
       stencil N from the clock lettering. Chrome store icons keep the art
       inside 96×96 with 16 px of transparent padding. -->
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff2a55"/>
      <stop offset="1" stop-color="#a66bff"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22111d"/>
      <stop offset="1" stop-color="#0b0710"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <path d="M16 16 H96 L112 32 V112 H32 L16 96 Z" fill="url(#card)"/>
  <path d="M17.5 17.5 H95.4 L110.5 32.6 V110.5 H32.6 L17.5 95.4 Z" fill="none" stroke="url(#edge)" stroke-width="3" filter="url(#glow)"/>
  <g fill="none" stroke="#fff" stroke-width="8" stroke-linejoin="bevel" filter="url(#glow)">
    <path d="M42 88 V40 L77 88"/>
    <path d="M86 40 V88"/>
  </g>
</svg>
